name: Native builds (Android APK / iOS)
# 수동 실행 또는 v* 태그 푸시 때 앱을 빌드합니다.
# - Android: 공용 디버그 키로 서명된 APK(바로 설치 가능)
# - iOS: 시뮬레이터용 .app + 서명 없는 .ipa(아이폰 설치에는 Apple 계정 서명 필요)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 태그(예: v0.3.2). 비우면 파일만 Actions에 올림'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AbilityKingdom-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: AbilityKingdom-android.apk
      - if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: 어빌리티킹덤 ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: AbilityKingdom-android.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build && npx cap sync ios
      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/AbilityKingdom-ios-simulator.zip" App.app
      - name: Build unsigned device app (.ipa)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry AbilityKingdom-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            AbilityKingdom-ios-unsigned.ipa
            AbilityKingdom-ios-simulator.zip
      - if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: 어빌리티킹덤 ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            AbilityKingdom-ios-unsigned.ipa
            AbilityKingdom-ios-simulator.zip
